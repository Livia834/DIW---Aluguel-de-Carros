<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Veículos - Drivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="index.html">
        <!-- AQUI LOGO CLARA / AQUI LOGO ESCURA -->
        <img src="logo-drivo.png" alt="Drivo (Logo Clara / Logo Escura)" class="logo-drivo-img">
      </a>
      <div class="mx-auto d-none d-md-flex gap-4">
        <a href="index.html" class="text-decoration-none text-secondary">Início</a>
        <a href="catalogo.html" class="text-decoration-none fw-semibold text-primary">Veículos</a>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button id="btn-tema" class="btn btn-outline-secondary rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-moon" id="icone-tema"></i>
        </button>
        <div id="auth-buttons">
          <a href="login.html" class="btn btn-outline-primary px-3 fw-medium">Entrar</a>
          <a href="cadastro.html" class="btn btn-primary px-3 fw-medium">Cadastrar</a>
        </div>
        <div id="user-menu" class="dropdown d-none">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i> <span id="nav-username">Usuário</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="cliente-painel.html">Meu Painel / Reservas</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" onclick="event.preventDefault(); abrirModalConfirmacaoLogout()">Sair</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <h1 class="fw-bold">Catálogo de Veículos Disponíveis</h1>
        <p class="text-secondary">Escolha entre diversas opções oferecidas por nossas lojas e bancos parceiros. Veja a propriedade e detalhes de cada automóvel.</p>
      </div>
      <div class="col-md-6 text-md-end">
        <a href="cliente-painel.html" class="btn btn-outline-primary"><i class="bi bi-bookmark-check"></i> Ver Meus Pedidos e Perfil</a>
      </div>
    </div>

    <!-- Lista de Carros -->
    <div class="row g-4" id="grid-catalogo">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
