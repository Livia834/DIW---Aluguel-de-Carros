<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Drivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="index.html">
        <!-- AQUI LOGO CLARA / AQUI LOGO ESCURA -->
        <img src="logo-drivo.png" alt="Drivo ( Logo Clara /  Logo Escura)" class="logo-drivo-img">
      </a>
      <div class="d-flex align-items-center gap-2">
        <button id="btn-tema" class="btn btn-outline-secondary rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-moon" id="icone-tema"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container d-flex flex-column align-items-center justify-content-center my-5" style="min-height: 75vh;">
    <div class="text-center mb-4">
      <i class="bi bi-car-front-fill text-primary fs-2 mb-2 d-inline-block"></i>
      <h1 class="fw-bold display-6 mb-2">Bem-vindo de volta</h1>
      <p class="text-secondary">Acesse sua conta no Drivo</p>
    </div>

    <div class="card-login w-100" style="max-width: 440px;">
      <form id="form-login">
        <div class="mb-3">
          <label for="email" class="form-label form-label-custom text-uppercase">E-mail</label>
          <input type="email" class="form-control" id="email" placeholder="cliente@email.com" required>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label form-label-custom text-uppercase">Senha</label>
          <input type="password" class="form-control" id="senha" placeholder="********" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Entrar</button>
        <div class="text-center fs-6 text-secondary">
          Não tem conta? <a href="cadastro.html" class="text-primary text-decoration-none fw-semibold">Cadastre-se</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
